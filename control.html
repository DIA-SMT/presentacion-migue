<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1623">
<title>Botonera · Migue</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="remoto.js"></script>
<style>
@font-face { font-family: 'Poppins'; font-weight: 600; src: url(fonts/Poppins-SemiBold.ttf); }
@font-face { font-family: 'Poppins'; font-weight: 800; src: url(fonts/Poppins-ExtraBold.ttf); }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: #0f1623; color: #fff; font-family: 'Poppins', system-ui, sans-serif; user-select: none; overflow: hidden; touch-action: manipulation; }
body { display: grid; grid-template-rows: auto 1.25fr 1.6fr .75fr .6fr; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)); height: 100dvh; }
button { font-family: inherit; border: 0; color: inherit; border-radius: 24px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transition: transform .08s ease, filter .15s ease; }
button:active { transform: scale(.97); filter: brightness(1.25); }
button small { font-size: 15px; font-weight: 600; opacity: .8; max-width: 92%; line-height: 1.25; text-align: center; }

.estado { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: #9aa6b8; }
.estado b { color: #fff; font-size: 16px; }
.estado .titulo { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #d3dae6; }
.punto { width: 12px; height: 12px; border-radius: 50%; background: #e5484d; flex: none; }
.punto.ok { background: #3ecf8e; }

#migue { background: #f4dc00; color: #222; font-size: 30px; }
#migue.suena { background: #3ecf8e; }
#siguiente { background: #0066ff; font-size: 40px; }
.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tres { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.gris { background: #242f42; font-size: 22px; }
.ef { background: #1a2332; border: 2px solid #2b3850; font-size: 17px; border-radius: 20px; }
.ef.on { background: #3ecf8e; border-color: #3ecf8e; color: #0d2419; }
</style>
</head>
<body>

<div class="estado"><span class="punto" id="punto"></span><span class="titulo" id="titulo">Conectando…</span><b id="num">–</b></div>

<button id="migue">MIGUE HABLA<small id="migueSub">Próximo video</small></button>

<button id="siguiente">SIGUIENTE ▶</button>

<div class="dos">
  <button class="gris" id="anterior">◀ Anterior</button>
  <button class="gris" id="callar">Callar</button>
</div>

<div class="tres">
  <button class="ef" id="azahar">Azahar</button>
  <button class="ef" id="qr">QR</button>
  <button class="ef" id="pregunta">Pregunta<small>en vivo</small></button>
</div>

<script>
const $ = (id) => document.getElementById(id);
// La pregunta en vivo de la botonera. Para elegir otra, usar control-completo.
const PREGUNTA = 'Ehh, necesito llegar rápido al trabajo, ¿hay algún corte en la San Lorenzo hoy?';
let ultimo = null;
const remoto = window.Remoto.iniciar({
  rol: 'control',
  alRecibirEstado: (e) => { ultimo = e; pintar(e); },
  alCambiarConexion: (ok, txt) => { $('punto').classList.toggle('ok', ok); if (!ok) $('titulo').textContent = txt; },
});

// Un toque = una orden. Se ignoran los toques repetidos muy seguidos, para
// que un doble toque nervioso no salte dos placas.
const ultimoToque = {};
function boton(id, accion) {
  $(id).addEventListener('click', () => {
    const ahora = Date.now(); if (ahora - (ultimoToque[id] || 0) < 700) return; ultimoToque[id] = ahora;
    accion(); if (navigator.vibrate) navigator.vibrate(18);
  });
}
const enviar = (c) => remoto.enviarComando(c);
boton('siguiente', () => enviar({ cmd: 'siguiente' }));
boton('anterior', () => enviar({ cmd: 'anterior' }));
boton('migue', () => enviar({ cmd: 'migue' }));
boton('callar', () => enviar({ cmd: 'callar' }));
boton('azahar', () => enviar({ cmd: 'azahar' }));
boton('qr', () => enviar({ cmd: 'qr', on: !$('qr').classList.contains('on') }));
boton('pregunta', () => enviar(ultimo && ultimo.vivo ? { cmd: 'cerrar-pregunta' } : { cmd: 'preguntar', texto: PREGUNTA }));

function pintar(e) {
  $('punto').classList.add('ok');
  $('titulo').textContent = e.empezado === false ? 'Tocá la pantalla grande para empezar' : (e.titulo || '');
  $('num').textContent = `${e.placa}/${e.total}`;
  const v = e.videos || [];
  $('migue').classList.toggle('suena', !!e.hablando);
  $('migue').firstChild.textContent = e.hablando ? 'MIGUE HABLANDO' : 'MIGUE HABLA';
  $('migueSub').textContent = e.hablando ? (v[e.actual] || '') : (v[e.proximo] ? `${e.proximo + 1}. ${v[e.proximo]}` : 'No quedan videos');
  $('qr').classList.toggle('on', !!(e.efectos && e.efectos.qr));
  $('pregunta').classList.toggle('on', !!e.vivo);
  $('pregunta').firstChild.textContent = e.vivo ? 'Cerrar' : 'Pregunta';
}

// Que la pantalla del celular no se apague en medio de la charla.
async function despierto() { try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) { } }
despierto(); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') despierto(); });
</script>
</body>
</html>
