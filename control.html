<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0066ff">
<title>Control · Migue</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="remoto.js"></script>
<style>
@font-face { font-family: 'Poppins'; font-weight: 400; src: url(fonts/Poppins-Regular.ttf); }
@font-face { font-family: 'Poppins'; font-weight: 600; src: url(fonts/Poppins-SemiBold.ttf); }
@font-face { font-family: 'Poppins'; font-weight: 700; src: url(fonts/Poppins-Bold.ttf); }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: #1b1f26; color: #fff; font-family: 'Poppins', system-ui, sans-serif; min-height: 100%; user-select: none; }
body { padding: 16px; display: flex; flex-direction: column; gap: 14px; max-width: 560px; margin: 0 auto; }
.estado { display: flex; justify-content: space-between; align-items: center; font-size: 15px; opacity: .85; }
.punto { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #e5484d; margin-right: 8px; }
.punto.ok { background: #3ecf8e; }
.titulo { font-size: 20px; font-weight: 700; line-height: 1.25; min-height: 50px; }
.notas { font-size: 16px; line-height: 1.45; background: #262b34; border-radius: 16px; padding: 14px 16px; max-height: 30vh; overflow: auto; color: #d6dbe3; }
button { font-family: inherit; border: 0; border-radius: 20px; color: #fff; font-weight: 700; cursor: pointer; transition: transform .08s ease, filter .08s ease; }
button:active { transform: scale(.97); filter: brightness(1.15); }
.fila { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.nav { background: #0066ff; font-size: 22px; padding: 26px 0; }
.nav.ant { background: #2d3440; }
#hablar { background: #f4dc00; color: #333; font-size: 24px; padding: 26px 16px; display: flex; align-items: center; justify-content: center; gap: 14px; }
#hablar img { width: 54px; height: 54px; border-radius: 50%; background: #fff; object-fit: cover; }
#hablar.suena { background: #3ecf8e; }
.chico { background: #2d3440; font-size: 16px; padding: 16px 0; }
h3 { font-size: 14px; letter-spacing: 2px; text-transform: uppercase; opacity: .7; margin-top: 6px; }
.videos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.videos button { background: #262b34; font-size: 15px; font-weight: 600; padding: 14px 10px; text-align: left; line-height: 1.3; border: 2px solid transparent; }
.videos button.prox { border-color: #f4dc00; }
.videos button.ahora { background: #3ecf8e; color: #10231a; }
</style>
</head>
<body>
<div class="estado"><span><span class="punto" id="punto"></span><span id="conex">Conectando…</span></span><span id="num">– / –</span></div>
<div class="titulo" id="titulo">—</div>
<button id="hablar"><img src="img/migue-cara.png" alt=""><span id="hablarTxt">Migue habla</span></button>
<div class="fila">
  <button class="nav ant" data-cmd="anterior">◀ Anterior</button>
  <button class="nav" data-cmd="siguiente">Siguiente ▶</button>
</div>
<div class="fila">
  <button class="chico" data-cmd="callar">Callar a Migue</button>
  <button class="chico" data-cmd="ocultar">Ocultar / mostrar</button>
</div>
<div class="notas" id="notas">Las notas de cada placa aparecen acá.</div>
<h3>Videos de Migue</h3>
<div class="videos" id="videos"></div>
<div class="fila"><button class="chico" data-cmd="repetir">Repetir el último</button><button class="chico" data-cmd="reiniciar">Volver al video 1</button></div>
<script>
let ultimoEstado = null;
const remoto = window.Remoto.iniciar({
  rol: "control",
  alRecibirEstado: (e) => { ultimoEstado = e; pintar(e); },
  alCambiarConexion: (ok, txt) => {
    document.getElementById("punto").classList.toggle("ok", ok);
    document.getElementById("conex").textContent = ok && ultimoEstado && ultimoEstado.empezado === false ? "Falta tocar la pantalla para empezar" : txt;
  },
});
function enviar(c) { remoto.enviarComando(c); if (navigator.vibrate) navigator.vibrate(15); }
document.querySelectorAll("[data-cmd]").forEach(b => b.addEventListener("click", () => enviar({ cmd: b.dataset.cmd })));
document.getElementById("hablar").addEventListener("click", () => enviar({ cmd: "migue" }));
let listaHecha = "";
function pintar(e) {
  document.getElementById("punto").classList.add("ok");
  document.getElementById("conex").textContent = e.empezado === false ? "Falta tocar la pantalla para empezar" : "Conectado";
  document.getElementById("num").textContent = `${e.placa} / ${e.total}`;
  document.getElementById("titulo").textContent = e.titulo || "—";
  document.getElementById("notas").textContent = e.notas || "";
  const videos = e.videos || [];
  const hablar = document.getElementById("hablar");
  hablar.classList.toggle("suena", !!e.hablando);
  document.getElementById("hablarTxt").textContent = e.hablando ? `Hablando: ${videos[e.actual] || ""}` : e.proximo < videos.length ? `Migue habla · ${videos[e.proximo]}` : "No quedan videos";
  const firma = videos.join("|");
  const cont = document.getElementById("videos");
  if (firma !== listaHecha) {
    cont.innerHTML = ""; listaHecha = firma;
    videos.forEach((t, i) => { const b = document.createElement("button"); b.textContent = `${i + 1}. ${t}`; b.addEventListener("click", () => enviar({ cmd: "migue", n: i })); cont.appendChild(b); });
  }
  [...cont.children].forEach((b, i) => { b.classList.toggle("prox", i === e.proximo && !e.hablando); b.classList.toggle("ahora", i === e.actual && e.hablando); });
}
</script>
</body>
</html>
